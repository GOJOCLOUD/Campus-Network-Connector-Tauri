[package]
name = "simuinput-tauri"
version = "0.0.0"
description = "模拟输入 · Tauri 版"
edition = "2021"
rust-version = "1.77"

[lib]
name = "simuinput_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ttf-parser = "0.25"
ed25519-dalek = "2"
sha2 = "0.10"
hex = "0.4"
rayon = "1"
flate2 = "1"
tauri-plugin-shell = "2"
# 全局快捷键(⌃⇧A 默认执行 / ⌃⇧D 剪贴板直输)与单实例 ——
# 这两条是 Electron 版 main.js 里本来就有的能力,ADR-0012 要求 macOS 线全量补齐。
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# 设备指纹用的随机源:跨平台(原来的 libc::arc4random_buf 只有 BSD/macOS 有)
getrandom = "0.2"

# ── Windows 线的「浏览器复制修复」:自己起 Edge + CDP 注入守卫(ADR-0030) ──
#
# tokio:tauri 已经带了一份,这里的特性是**加性合并**(不会覆盖 tauri 的)。
#   macros → select!;time → interval/timeout;sync → mpsc/oneshot;net → TcpStream。
tokio = { version = "1", features = ["macros", "time", "sync", "net", "rt", "io-util"] }
# 最小 CDP 客户端用 tokio-tungstenite(**不自己解析 WebSocket 帧**)。
# ⚠️ 版本必须钉住:0.21 起 `Message::Text` 装的是 `Utf8Bytes` 而不是 `String`。
# ⚠️ `default-features = false` 很重要:不带 TLS 特性 ⇒ Windows 上不会拖进
#    openssl / native-tls(我们只连 127.0.0.1 的 ws:// ,用不上 TLS)。
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect", "handshake"] }
# `SinkExt::send` 需要 "sink" 特性(futures-util 默认不带)。
futures-util = { version = "0.3", features = ["sink"] }

# ── macOS 专属 ─────────────────────────────────────────────
# CoreGraphics / Carbon / objc2 只在 macOS 上编得过。
#
# 注意:**不要**在这里写 `tauri = { features = ["macos-private-api"] }`。
# tauri-build 的特性校验是**全局**的(不按 target),它要求 Cargo.toml 里
# tauri 的 features 与 tauri.conf.json 里 macOSPrivateApi 推出的期望值一致;
# 只要 Cargo.toml 里带着这个特性,Windows 构建就会把 objc2 也拉进来 →
# 直接死在 "objc2 only works on Apple platforms"。
#
# 而且 Tauri 2.12.1 起 `macos-private-api` 已是**空操作**(私有 API 恒开,
# 透明窗口照常可用),tauri-runtime/tao 里也没有任何 `#[cfg(feature=...)]`
# 代码路径用它 —— 所以干脆不要这个特性,两个平台都干净。
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
# core-foundation 0.10 没有把 kCFRunLoopDefaultMode 导出到安全 API,
# 但录制(CGEventTap)要把 mach port source 挂到 run loop 上 → 直接用 sys 层常量。
core-foundation-sys = "0.8"
core-graphics = "0.24"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSScreen", "NSPasteboard", "NSEvent", "NSAppleScriptExtensions", "NSApplication", "NSMenu", "NSView", "NSGraphics", "NSResponder"] }
objc2-carbon = "0.3"
# keepalive 每 3 分钟发一次 HTTPS 请求(与 Electron 版 main.js 的 pingNetwork 同口径)。
# Windows 线不做 keepalive(ADR-0012),所以这个依赖只挂在 macOS 上,Windows 包不带它。
# TLS 后端是 rustls + ring(不是 aws-lc-rs)→ 不需要 cmake / C 编译器,CI 干净。
ureq = { version = "2", features = ["tls"] }

# 集成测试要直接用 core-graphics 建自己的事件监听(诊断 tap 是否真能收到系统事件),
# 所以这里再声明一份 dev 依赖。
[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics = "0.24"

# ── Windows 专属 ───────────────────────────────────────────
# 鼠标/键盘走 SendInput(与 Electron 版的 win-input 同一套约定:
# 屏幕像素坐标、修饰键位 1=shift 2=ctrl 4=alt 8=win)。
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
