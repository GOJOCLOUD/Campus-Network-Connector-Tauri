name: Build macOS Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - mac

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: |
          npm ci
          cd tauri-app && npm ci

      # 前端产物 dist/ 会被 Tauri 打进包里
      - name: Build frontend
        run: npm run build

      # 硬门禁:frame-bridge 的回归测试(跑不过就不发包)。
      # 盯的是"站点换掉嵌套 iframe 之后,映射还能不能送到新那层"——
      # 2026-10-23 真机故障就是这个:frame 名单过期 → 题目那层一份映射都收不到
      # → 复制出来还是密文。
      # 同一套用例跑两遍:**入库产物**(真正装进 App 的那份)与**源码现编**(真身),
      # 防止源码改了而产物忘了同步 —— 那是静默漂移,别的地方发现不了。
      - name: frame-bridge regression test
        run: node --test tools/verify/verify-frame-bridge.cjs

      # 硬门禁:页面守卫的回归测试(跑不过就不发包)。
      # 盯的是"换题之后新作用域会不会被发现、映射会不会真的到页面上":
      # 2026-10-23 末那次真机故障(换题后第 1 次复制成功、第 2 次复制出密文)
      # 就是守卫的三处根因 —— 详见 ADR-0017。
      # 同一套用例跑两遍:**入库产物**(resources/page-guard.js,真正嵌进 App 的那份)
      # 与**源码现编**(真身)—— 源码改了而产物忘了同步,会被"产物那半"当场抓住。
      - name: page-guard regression test
        run: node --test tools/verify/verify-page-guard.cjs

      # 硬门禁:共享代码的两条不变量(跑不过就不发包)。
      #
      # ① 字形渲染的**栅格尺寸**必须与参考字形库一致 ——
      #    不一致 ⇒ 送进匹配器的位图与库里的字形**错位** ⇒ 最近邻全是噪声
      #    (实测落到「爫」「﹊」这类符号上,margin≈0)⇒ 永远判不出混淆
      #    ⇒ 复制出来还是密文,**而且全程不报错**。
      #    2026-10-25 实测踩过:渲染器 32×32、库 48×48。
      #
      # ② 扩展 ID 必须在 manifest / Rust / JS / 产物四处**算成同一个值** ——
      #    算错 ⇒ 注册表写到一把**没人认的键**上 ⇒ 开关显示「已接管」,
      #    浏览器里什么都没有(同样不报错)。
      - name: Glyph grid + extension ID gates
        run: node --test tools/verify/verify-glyph-grid.cjs tools/verify/verify-extension-id.cjs

      # 硬门禁:界面层的回归(跑不过就不发包)。
      # - 换页时内容区**底下**那条横向滚动条不许再出现
      #   (用户反馈「下面有个滑条在滑动」),画面横滑的动画不许丢;
      # - 录制的**单条删除**,以及「点自己界面上的按钮不算一次点击」的契约
      #   (开始录制不再由前端传那张会过期的矩形)。
      # 这两条要读**构建出来的 dist/**(真正装进 App 的那份前端),
      # 所以必须放在 "Build frontend" 之后。
      - name: UI regression test
        run: node --test tools/verify/verify-panel-transition.cjs tools/verify/verify-recording-ui.cjs

      # 硬门禁:浏览器修复扩展的**端到端**(跑不过就不发包)。
      #
      # 这是**唯一**能证明「网页上复制出来是明文」的用例 ——
      # 2026-10-25「浏览器修复是失效的」就是它**没进 CI** 才漏出去的。
      #
      # 它要真实 Chrome + 系统剪贴板 ⇒ 只能跑在 macOS runner 上
      # (Windows runner 的剪贴板在 session 0 里,读不到 ⇒ 那边靠静态门禁)。
      #
      # 字形库直接用**仓库里已入库的那份**(tauri-app/src-tauri/resources/…),
      # 不用现场重建:重建要栅格化 GBK 全集,慢且没必要。
      - name: Chromium extension build + e2e test
        shell: bash
        run: |
          mkdir -p vendor
          cp tauri-app/src-tauri/resources/glyph-db-48.crdb.gz vendor/glyph-db-48.crdb.gz
          node tools/build.mjs chromium
          node --test tools/verify/verify-chromium-extension.cjs
          npm run test:e2e

      # 硬门禁:平台界面自检(跑不过就不发包)。
      # 盯的是「该藏的步骤有没有真的藏起来」:
      #   - Windows 上不该出现的「模拟点击(录制)」与「默认执行(回放)」两步;
      #   - 原生模块好好的,却报一条红底白字「原生模块加载失败」;
      #   - 反过来也验:原生模块**真的坏了**时,那条横幅必须出现(免得它变成死代码)。
      # 这条门禁以前**只在本机跑**(没接进 CI)⇒ 它护的东西没人护。2026-10-24 补上。
      # 需要构建出来的 dist/ → 必须放在 "Build frontend" 之后。
      - name: Platform UI self-check
        run: node tools/verify/verify-ui-platforms.cjs

      # 参考库(glyph-db-48.crdb.gz)与页面守卫是**提交进仓库**的构建产物,
      # 这里不需要重建；要重建用 npm run build:reference-db / build:vendor。
      #
      # Rust 单元测试放在**打包之前**:跑不过就不发包。
      # 这些测试盯的是"链路会不会又断一次"(守卫上报的字段名、注入脚本的字符串
      # 字面量、混淆字体能不能整份还原)—— 之前 Rust 侧一个测试都没有,
      # Safari 修复整条链断掉时没人发现(2026-10-22 那次就是)。
      # 必须在 "Build frontend" 之后跑:tauri 的构建脚本会检查 frontendDist 在不在。
      - name: Rust unit tests
        working-directory: tauri-app/src-tauri
        run: cargo test --lib

      - name: Build Tauri .app
        run: |
          cd tauri-app
          npx @tauri-apps/cli@2 build --bundles app

      # 交付约定：统一出 zip（体积一样，解压即用）。
      # ditto 能保住 .app 里的符号链接（zip 命令行要额外加 -y）。
      - name: Package as zip
        run: |
          set -euo pipefail
          APP=$(find tauri-app/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "release/CampusNetworkConnector-mac-tauri-0.0.0.zip"
          ls -la release/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Tauri-Mac
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release（zip 附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="release/CampusNetworkConnector-mac-tauri-0.0.0.zip"
          TAG="mac-tauri-${{ github.run_id }}"
          TITLE="macOS Tauri build ${{ github.run_id }} (${{ github.ref_name }})"
          gh release create "$TAG" "$ZIP" --title "$TITLE" --notes "Tauri 版 macOS 构建" --prerelease
          echo "Published: $TAG"
