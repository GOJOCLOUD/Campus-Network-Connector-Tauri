name: Build macOS Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - mac

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: |
          npm ci
          cd tauri-app && npm ci

      # 前端产物 dist/ 会被 Tauri 打进包里
      - name: Build frontend
        run: npm run build

      # 硬门禁:frame-bridge 的回归测试(跑不过就不发包)。
      # 盯的是"站点换掉嵌套 iframe 之后,映射还能不能送到新那层"——
      # 2026-10-23 真机故障就是这个:frame 名单过期 → 题目那层一份映射都收不到
      # → 复制出来还是密文。
      # 同一套用例跑两遍:**入库产物**(真正装进 App 的那份)与**源码现编**(真身),
      # 防止源码改了而产物忘了同步 —— 那是静默漂移,别的地方发现不了。
      - name: frame-bridge regression test
        run: node --test tools/verify/verify-frame-bridge.cjs

      # 参考库(glyph-db-48.crdb.gz)与页面守卫是**提交进仓库**的构建产物,
      # 这里不需要重建；要重建用 npm run build:reference-db / build:vendor。
      #
      # Rust 单元测试放在**打包之前**:跑不过就不发包。
      # 这些测试盯的是"链路会不会又断一次"(守卫上报的字段名、注入脚本的字符串
      # 字面量、混淆字体能不能整份还原)—— 之前 Rust 侧一个测试都没有,
      # Safari 修复整条链断掉时没人发现(2026-10-22 那次就是)。
      # 必须在 "Build frontend" 之后跑:tauri 的构建脚本会检查 frontendDist 在不在。
      - name: Rust unit tests
        working-directory: tauri-app/src-tauri
        run: cargo test --lib

      - name: Build Tauri .app
        run: |
          cd tauri-app
          npx @tauri-apps/cli@2 build --bundles app

      # 交付约定：统一出 zip（体积一样，解压即用）。
      # ditto 能保住 .app 里的符号链接（zip 命令行要额外加 -y）。
      - name: Package as zip
        run: |
          set -euo pipefail
          APP=$(find tauri-app/src-tauri/target/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP"
          ditto -c -k --keepParent "$APP" "release/CampusNetworkConnector-mac-tauri-0.0.0.zip"
          ls -la release/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Tauri-Mac
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release（zip 附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZIP="release/CampusNetworkConnector-mac-tauri-0.0.0.zip"
          TAG="mac-tauri-${{ github.run_id }}"
          TITLE="macOS Tauri build ${{ github.run_id }} (${{ github.ref_name }})"
          gh release create "$TAG" "$ZIP" --title "$TITLE" --notes "Tauri 版 macOS 构建" --prerelease
          echo "Published: $TAG"
