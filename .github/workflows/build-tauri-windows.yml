name: Build Windows Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - win

jobs:
  build-win:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: |
          npm ci
          cd tauri-app
          npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri NSIS installer
        run: |
          cd tauri-app
          npx @tauri-apps/cli@2 build --bundles nsis

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Tauri-Win
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release（exe 附件）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "tauri-app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1)
          $tag = "win-tauri-${{ github.run_id }}"
          $title = "Windows Tauri build ${{ github.run_id }} (${{ github.ref_name }})"
          gh release create $tag $exe.FullName --title $title --notes "Tauri 版 Windows 构建" --prerelease
          "Published: $tag"
