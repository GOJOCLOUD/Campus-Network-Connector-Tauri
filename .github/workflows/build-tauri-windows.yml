name: Build Windows Tauri App

on:
  workflow_dispatch:
  push:
    branches:
      - win

jobs:
  build-win:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm dependencies
        run: |
          npm ci
          cd tauri-app
          npm ci

      - name: Build frontend
        run: npm run build

      # 硬门禁:frame-bridge 的回归测试(跑不过就不发包)。
      # 盯的是"站点换掉嵌套 iframe 之后,映射还能不能送到新那层"——
      # 2026-10-23 真机故障就是这个:frame 名单过期 → 题目那层一份映射都收不到
      # → 复制出来还是密文。
      # 同一套用例跑两遍:**入库产物**(真正装进 App 的那份)与**源码现编**(真身),
      # 防止源码改了而产物忘了同步 —— 那是静默漂移,别的地方发现不了。
      - name: frame-bridge regression test
        run: node --test tools/verify/verify-frame-bridge.cjs

      # 硬门禁:页面守卫的回归测试(跑不过就不发包)。
      # 盯的是"换题之后新作用域会不会被发现、映射会不会真的到页面上":
      # 2026-10-23 末那次真机故障(换题后第 1 次复制成功、第 2 次复制出密文)
      # 就是守卫的三处根因 —— 详见 ADR-0017。
      # 同一套用例跑两遍:**入库产物**(resources/page-guard.js,真正嵌进 App 的那份)
      # 与**源码现编**(真身)—— 源码改了而产物忘了同步,会被"产物那半"当场抓住。
      - name: page-guard regression test
        run: node --test tools/verify/verify-page-guard.cjs

      # 硬门禁:Windows 线的浏览器复制修复**整条链路**必须真跑通(跑不过就不发包)。
      #
      # 2026-10-26 起 Windows 线改成「软件自己起 Edge + CDP 注入守卫」
      # (原先的「注册表外部扩展」路线实测走不通:装上会被验证器禁用,
      #  而且改完还要用户重启一次浏览器 —— 违反零点击底线。见 ADR-0030)。
      #
      # 这条门禁盯的就是那条链路的**每一环**:
      #   起浏览器 → CDP 连上 → document_start 注入守卫 → 守卫采到混淆字体
      #   → App 侧**真字形识别**算出映射 → 映射下发回页面
      #   → 合成 Ctrl+C → **系统剪贴板里是明文**
      #
      # 用的全是仓库里的**生产模块**(chromium::browser / chromium::bridge /
      # chromium::coordinator / safari::repair 的字形引擎),不是另写一份玩具实现
      # ⇒ 这条红了,装出来的包也是坏的。
      #
      # 之所以必须真跑浏览器:前面几环**静态检查抓不到** ——
      # 2026-10-26 的实测就抓到过「commands:['copy'] 不触发 DOM copy 事件」。
      - name: CDP copy-repair end-to-end gate
        working-directory: tauri-app/src-tauri
        run: cargo test --test cdp_copy_repair -- --nocapture

      # 硬门禁:浏览器连不上时**绝不能**疯狂重开 Edge(跑不过就不发包)。
      #
      # 盯的是 2026-10-27 真机踩出来的 bug:
      # 恢复流程只认 Chromium 自己写的 DevToolsActivePort 文件,
      # 而**同 profile 的第二个浏览器是「转发启动」**(Chromium 单例)——
      # 它退出时会把那个文件**删掉** ⇒ 永远找不回上次那个浏览器
      # ⇒ 每 29 秒重开一个 Edge(还多开一个空白标签页),
      # 而且**再也没连回那个 Edge** ⇒ 新标签页没守卫、复制出来还是密文。
      #
      # 这条门禁要求:三条候选(自己记的端口 → DevToolsActivePort → 扫进程命令行)
      # 全部试过之前**不许起新的**;并且真跑一遍,验证断线后连回的是**同一个**浏览器。
      - name: CDP browser recovery gate
        working-directory: tauri-app/src-tauri
        run: cargo test --test cdp_browser_recovery -- --nocapture

      - name: build flavor gate
        run: node --test tools/verify/verify-build-flavor.cjs

      # 硬门禁:共享代码的一条不变量(跑不过就不发包)。
      #
      # 字形渲染的**栅格尺寸**必须与参考字形库一致 ——
      #    不一致 ⇒ 送进匹配器的位图与库里的字形**错位** ⇒ 最近邻全是噪声
      #    (实测落到「爫」「﹊」这类符号上,margin≈0)⇒ 永远判不出混淆
      #    ⇒ 复制出来还是密文,**而且全程不报错**。
      #    2026-10-25 实测踩过:渲染器 32×32、库 48×48。
      - name: Glyph grid gate
        run: node --test tools/verify/verify-glyph-grid.cjs

      # 硬门禁:界面层的回归(跑不过就不发包)。
      # - 换页时内容区**底下**那条横向滚动条不许再出现
      #   (用户反馈「下面有个滑条在滑动」),画面横滑的动画不许丢;
      # - 录制的**单条删除**,以及「点自己界面上的按钮不算一次点击」的契约
      #   (开始录制不再由前端传那张会过期的矩形)。
      # 这两条要读**构建出来的 dist/**(真正装进 App 的那份前端),
      # 所以必须放在 "Build frontend" 之后。
      #
      # ⚠️ 找 Chrome 的方式统一走 tools/chrome-path.cjs ——
      # Windows 上没有 $HOME,各版本自己拼路径会拼成相对路径,必然找不到浏览器
      # (Electron 线踩过一次:门禁本身没毛病,是它找不到 Chrome)。
      - name: UI regression test
        run: node --test tools/verify/verify-panel-transition.cjs tools/verify/verify-recording-ui.cjs

      # 硬门禁:平台界面自检(跑不过就不发包)。
      # 盯的是「该藏的步骤有没有真的藏起来」:
      #   - Windows 上不该出现的「模拟点击(录制)」与「默认执行(回放)」两步;
      #   - 原生模块好好的,却报一条红底白字「原生模块加载失败」;
      #   - 反过来也验:原生模块**真的坏了**时,那条横幅必须出现(免得它变成死代码)。
      # 这条门禁以前**只在本机跑**(没接进 CI)⇒ 它护的东西没人护。2026-10-24 补上。
      # 需要构建出来的 dist/ → 必须放在 "Build frontend" 之后。
      - name: Platform UI self-check
        run: node tools/verify/verify-ui-platforms.cjs

      # Rust 单元测试放在**打包之前**:跑不过就不发包。
      # 这些测试盯的是"链路会不会又断一次"(守卫上报的字段名、注入脚本的字符串
      # 字面量、混淆字体能不能整份还原)—— 之前 Rust 侧一个测试都没有,
      # Safari 修复整条链断掉时没人发现(2026-10-22 那次就是)。
      # 必须在 "Build frontend" 之后跑:tauri 的构建脚本会检查 frontendDist 在不在。
      - name: Rust unit tests
        working-directory: tauri-app/src-tauri
        run: cargo test --locked --lib

      - name: Build Tauri NSIS installer
        run: |
          cd tauri-app
          npx @tauri-apps/cli@2 build --bundles nsis

      # 硬门禁:安装包的**运行时产物**必须在(跑不过就不发包)。
      #
      # 盯的是「装上之后功能是坏的」那类问题:
      #   - NSIS 安装包与主程序都在;
      #   - 字形参考库(glyph-db-48.crdb.gz)真的被带进了产物目录,
      #     而且与仓库里那份**逐字节相同**(被截断/漏拷在这里当场暴露);
      #   - 前端产物完整(index.html 引用的资源都在)。
      #
      # Tauri 侧不涉及 electron-builder 的 build.files 白名单(那是 Electron 线的老坑),
      # 但「运行时产物齐不齐」这件事同样要有人盯 —— 没有人盯就等于没有。
      - name: Verify packaged runtime artifacts
        run: node tools/verify/verify-package-tauri-win.cjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Network-Connector-Tauri-Win
          path: tauri-app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release（exe）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = (Get-ChildItem "tauri-app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1)
          $tag = "win-tauri-${{ github.run_id }}"
          $title = "Windows Tauri build ${{ github.run_id }} (${{ github.ref_name }})"
          gh release create $tag $exe.FullName --title $title --notes "Tauri 版 Windows 构建" --prerelease
          "Published: $tag"
